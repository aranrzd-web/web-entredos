<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entre Dos Studio · Your Film</title>
  <link rel="icon" type="image/jpeg" href="logowebbo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Raleway:wght@300;400&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'The Seasons';
      src: url('THESEASONS-LT.OTF') format('opentype');
      font-weight: 300; font-style: normal;
    }
    @font-face {
      font-family: 'The Seasons';
      src: url('THESEASONS-REG.OTF') format('opentype');
      font-weight: 400; font-style: normal;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #F2EDE4;
      color: #231200;
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
    }

    /* ── LOCK SCREEN ── */
    #lockScreen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      animation: fadeIn 1s ease forwards;
    }
    .lock-logo {
      width: 120px;
      margin-bottom: 3rem;
    }
    .video-logo {
      width: 160px;
      margin-bottom: 2rem;
    }
    html, body {
      height: 100%;
      background: #f0e9e1;
      color: #231200;
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
    }
    .lock-title {
      font-family: 'The Seasons', 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #231200;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    .lock-subtitle {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.05rem;
      font-style: italic;
      color: rgba(35,18,0,0.55);
      margin-bottom: 3rem;
      text-align: center;
      letter-spacing: 0.03em;
    }
    .lock-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      width: 100%;
      max-width: 340px;
    }
    .input-wrap {
      width: 100%;
      position: relative;
    }
    .lock-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(35,18,0,0.25);
      color: #231200;
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      font-size: 0.95rem;
      padding: 12px 0;
      outline: none;
      letter-spacing: 0.1em;
      text-align: center;
      transition: border-color 0.3s ease;
    }
    .lock-input::placeholder {
      color: rgba(35,18,0,0.3);
      letter-spacing: 0.2em;
      font-size: 0.75rem;
      text-transform: uppercase;
    }
    .lock-input:focus { border-bottom-color: rgba(35,18,0,0.7); }
    .lock-btn {
      background: none;
      border: 1px solid rgba(35,18,0,0.3);
      color: rgba(35,18,0,0.8);
      font-family: 'Raleway', sans-serif;
      font-weight: 300;
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      padding: 14px 48px;
      cursor: pointer;
      transition: all 0.35s ease;
      margin-top: 0.5rem;
    }
    .lock-btn:hover {
      border-color: rgba(35,18,0,0.8);
      color: #231200;
      background: rgba(35,18,0,0.04);
    }
    .error-msg {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 0.95rem;
      font-style: italic;
      color: rgba(35,18,0,0.5);
      letter-spacing: 0.03em;
      opacity: 0;
      transition: opacity 0.4s ease;
      min-height: 1.4rem;
    }
    .error-msg.visible { opacity: 1; }

    .lock-divider {
      width: 30px;
      height: 1px;
      background: rgba(35,18,0,0.15);
      margin: 2rem auto 0;
    }

    /* ── VIDEO SCREEN ── */
    #videoScreen {
      display: none;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 3vw;
    }
    #videoScreen.visible {
      display: flex;
      animation: fadeIn 1.2s ease forwards;
    }
    .video-header {
      text-align: center;
      margin-bottom: 3rem;
    }
    .video-logo {
      width: 160px;
      margin-bottom: 2rem;
      opacity: 0.85;
    }
    .video-title {
      font-family: 'The Seasons', 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 400;
      letter-spacing: 0.06em;
      color: #231200;
      margin-bottom: 0.5rem;
    }
    .video-subtitle {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.05rem;
      font-style: italic;
      color: rgba(35,18,0,0.5);
      letter-spacing: 0.03em;
    }
    .video-wrap {
      width: 100%;
      /* Gran: gairebé tota l'amplada, però sense passar de l'alçada de la pantalla */
      width: min(100%, calc((100vh - 4rem) * 16 / 9));
      max-width: 1800px;
      aspect-ratio: 16 / 9;
      box-shadow: 0 20px 80px rgba(35,18,0,0.12);
    }
    .video-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .video-footer {
      margin-top: 3rem;
      text-align: center;
    }
    .video-footer p {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 0.95rem;
      font-style: italic;
      color: rgba(35,18,0,0.4);
      letter-spacing: 0.03em;
    }
    .download-btn {
      display: inline-block;
      margin-top: 1.5rem;
      background: none;
      border: 1px solid rgba(35,18,0,0.3);
      color: rgba(35,18,0,0.8) !important;
      font-family: 'Raleway', sans-serif !important;
      font-size: 0.7rem !important;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      padding: 14px 40px;
      text-decoration: none !important;
      border-bottom: 1px solid rgba(35,18,0,0.3) !important;
      transition: all 0.35s ease;
    }
    .download-btn:hover {
      border-color: rgba(35,18,0,0.8) !important;
      color: #231200 !important;
      background: rgba(35,18,0,0.04);
    }
    .video-footer a:not(.download-btn) {
      color: rgba(35,18,0,0.5);
      text-decoration: none;
      border-bottom: 1px solid rgba(35,18,0,0.2);
      transition: all 0.3s ease;
      font-family: 'Raleway', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      display: inline-block;
      margin-top: 1rem;
    }
    .video-footer a:not(.download-btn):hover {
      color: #231200;
      border-bottom-color: rgba(35,18,0,0.6);
    }

    /* ── Animació d'accents al títol ── */
    .title-burst {
      position: relative;
      display: inline-block;
    }
    .title-burst.pop {
      animation: titlePop 0.5s cubic-bezier(.2,.8,.3,1);
    }
    .burst-svg {
      position: absolute;
      left: 0;
      top: 0;
      overflow: visible;
      pointer-events: none;
    }
    .burst-svg line {
      stroke: #231200;
      stroke-opacity: 0.75;
      stroke-width: 1.3;
      stroke-linecap: round;
      animation: streak 0.75s cubic-bezier(.2,.7,.3,1) forwards;
    }
    @keyframes streak {
      0%   { stroke-dashoffset: var(--l); opacity: 1; }
      80%  { opacity: 1; }
      100% { stroke-dashoffset: calc(var(--l) * -1); opacity: 0; }
    }
    @keyframes titlePop {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.035); }
      100% { transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- LOCK SCREEN -->
  <div id="lockScreen">
    <img src="logowebbo.jpg" alt="Entre Dos Studio" class="lock-logo" />
    <h1 class="lock-title"><span class="title-burst" id="lockTitle">Your film is ready</span></h1>
    <p class="lock-subtitle">Enter your private access code to watch</p>

    <form class="lock-form" onsubmit="checkPassword(event)">
      <div class="input-wrap">
        <input
          type="password"
          id="passwordInput"
          class="lock-input"
          placeholder="Access code"
          autocomplete="off"
          autofocus
        />
      </div>
      <p class="error-msg" id="errorMsg">Incorrect code — please try again</p>
      <button type="submit" class="lock-btn">Watch the film</button>
    </form>

    <div class="lock-divider"></div>
  </div>

  <!-- VIDEO SCREEN -->
  <div id="videoScreen">
    <div class="video-header">
      <img src="logowebbo.jpg" alt="Entre Dos Studio" class="video-logo" />
      <h1 class="video-title" id="videoTitle"></h1>
      <p class="video-subtitle" id="videoSubtitle"></p>
    </div>

    <div class="video-wrap">
      <!-- El vídeo es carrega automàticament segons la contrasenya (mira FILMS a baix de tot) -->
      <iframe
        id="videoFrame"
        src=""
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>

    <div class="video-footer">
      <p>With love, Entre Dos Studio</p>
      <a href="#" id="downloadBtn" target="_blank" class="download-btn">↓ Download your film</a>
      <br>
      <a href="index.html">← Back to website</a>
    </div>
  </div>

  <script>
    // ============================================================
    //  VÍDEOS DE CLIENTS — una línia per parella
    //  'contrasenya': { title, subtitle, drive, youtube }
    //  drive   = ID de Google Drive (el tros entre /d/ i /view)
    //            → s'usa per al botó de descàrrega
    //  youtube = ID de YouTube (el tros després de watch?v=)
    //            → si hi és, el vídeo es veu des de YouTube (fins a 4K)
    //            → si no hi és, es veu des de Drive (màx. 1080p)
    //  Per afegir una parella nova, copia una línia i canvia-la.
    // ============================================================
    const FILMS = {
      'claudiavictor': { title: 'Clàudia & Víctor', subtitle: 'Wedding Film · 2026', drive: '1biJ3oawTvPv_FZwOBV2VW7aw_1YJazGd' },
      'carlaivan':     { title: 'Carla & Ivan',     subtitle: 'Wedding Film · 2026', drive: '1z4yYHa2LhK1-v2NGLYpfqgT7aOPzoID1', youtube: 'JmjyiFnFAt4' },
    };
    // ============================================================

    // ── Animació: línies d'accent tipus còmic / focs artificials ──
    // Dibuixa petites ratlles que surten dels dos costats del títol.
    // Retorna quants mil·lisegons dura, per esperar abans de mostrar el vídeo.
    function burst() {
      const title = document.getElementById('lockTitle');
      const w = title.offsetWidth, h = title.offsetHeight;
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      svg.setAttribute('class', 'burst-svg');
      svg.setAttribute('width', w);
      svg.setAttribute('height', h);

      // Dues onades: la primera més llarga, la segona més curta i una mica més tard
      const waves = [
        { delay: 0,   gap: 10, angles: [-52, -26, 0, 26, 52], lengths: [13, 19, 24, 19, 13] },
        { delay: 220, gap: 22, angles: [-39, -13, 13, 39],    lengths: [7, 10, 10, 7] }
      ];
      const sides = [
        { x: -4,    y: h * 0.48, base: 180 },  // esquerra
        { x: w + 4, y: h * 0.48, base: 0 }     // dreta
      ];

      sides.forEach(side => {
        waves.forEach(wave => {
          wave.angles.forEach((a, i) => {
            const ang = (side.base + (side.base === 180 ? -a : a)) * Math.PI / 180;
            const len = wave.lengths[i];
            const x1 = side.x + Math.cos(ang) * wave.gap;
            const y1 = side.y + Math.sin(ang) * wave.gap;
            const x2 = side.x + Math.cos(ang) * (wave.gap + len);
            const y2 = side.y + Math.sin(ang) * (wave.gap + len);
            const line = document.createElementNS(NS, 'line');
            line.setAttribute('x1', x1); line.setAttribute('y1', y1);
            line.setAttribute('x2', x2); line.setAttribute('y2', y2);
            line.setAttribute('stroke-dasharray', len);
            line.style.setProperty('--l', len + 'px');
            line.style.strokeDashoffset = len + 'px';
            line.style.animationDelay = wave.delay + 'ms';
            svg.appendChild(line);
          });
        });
      });

      title.appendChild(svg);
      title.classList.add('pop');
      setTimeout(() => svg.remove(), 1400);
      return 1050;
    }

    function checkPassword(e) {
      e.preventDefault();
      const input = document.getElementById('passwordInput').value.trim().toLowerCase();
      const errorMsg = document.getElementById('errorMsg');
      const film = FILMS[input];

      if (film) {
        // Correcte — carrega el vídeo d'aquesta parella
        document.getElementById('videoTitle').textContent = film.title;
        document.getElementById('videoSubtitle').textContent = film.subtitle;
        document.getElementById('videoFrame').src = film.youtube
          ? 'https://www.youtube-nocookie.com/embed/' + film.youtube + '?rel=0&modestbranding=1&playsinline=1'
          : 'https://drive.google.com/file/d/' + film.drive + '/preview';
        document.getElementById('downloadBtn').href = 'https://drive.google.com/uc?export=download&id=' + film.drive;
        document.title = film.title + ' · Entre Dos Studio';
        // Petita animació de "focs" al voltant del títol, i després el vídeo
        const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const burstTime = reduceMotion ? 0 : burst();
        setTimeout(() => {
          document.getElementById('lockScreen').style.animation = 'none';
          document.getElementById('lockScreen').style.transition = 'opacity 0.6s ease';
          document.getElementById('lockScreen').style.opacity = '0';
          setTimeout(() => {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('videoScreen').classList.add('visible');
          }, 600);
        }, burstTime);
      } else {
        // Incorrecte — mostra error i sacseja l'input
        errorMsg.classList.add('visible');
        document.getElementById('passwordInput').value = '';
        document.getElementById('passwordInput').style.borderBottomColor = 'rgba(35,18,0,0.5)';
        setTimeout(() => {
          errorMsg.classList.remove('visible');
          document.getElementById('passwordInput').style.borderBottomColor = '';
        }, 3000);
      }
    }
  </script>

</body>
</html>
